# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang]
        include:
          - os: windows-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: clang

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-curl

    - name: Setup test dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x scripts/setup_unity.sh scripts/setup_yyjson.sh
        ./scripts/setup_unity.sh
        ./scripts/setup_yyjson.sh

    - name: Setup test dependencies (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        bash scripts/setup_unity.sh
        bash scripts/setup_yyjson.sh

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DMONGORY_WITH_JSON=ON
        -S ${{ github.workspace }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DMONGORY_WITH_JSON=ON
        -S .

    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test (Linux)
      if: runner.os == 'Linux'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Test (Windows)
      if: runner.os == 'Windows'
      working-directory: build
      shell: msys2 {0}
      run: ctest --build-config ${{ matrix.build_type }}

  sanitizers:
    name: Sanitizers (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Debug + ASan/UBSan
            sanitizers: address,undefined
            asan_options: "detect_leaks=1:halt_on_error=1"
            ubsan_options: "print_stacktrace=1:halt_on_error=1"
            tsan_options: ""
          - label: Debug + TSan
            sanitizers: thread
            asan_options: ""
            ubsan_options: ""
            tsan_options: "halt_on_error=1:second_deadlock_stack=1"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Setup test dependencies
        run: |
          chmod +x scripts/setup_unity.sh scripts/setup_yyjson.sh
          ./scripts/setup_unity.sh
          ./scripts/setup_yyjson.sh
      - name: Configure CMake (Debug + ${{ matrix.sanitizers }})
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_BENCHMARKS=OFF
          -DMONGORY_WITH_JSON=ON
          -DMONGORY_SANITIZERS=${{ matrix.sanitizers }}
          -S .
      - name: Build
        run: cmake --build build --config Debug -j
      - name: Test
        working-directory: build
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          TSAN_OPTIONS: ${{ matrix.tsan_options }}
        run: ctest --build-config Debug --output-on-failure

  fuzz:
    name: Fuzz Smoke (libFuzzer + ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang and setup yyjson
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          bash scripts/setup_yyjson.sh
      - name: Build and run libFuzzer targets
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          clang -std=c99 -O1 -g -Wall -Wextra \
            -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all \
            -Iinclude src/foundations/*.c src/matchers/*.c tests/fuzz/fuzz_matcher.c \
            -o fuzz_matcher -lm -lpthread
          ./fuzz_matcher -max_total_time=15 -max_len=256

          clang -std=c99 -O1 -g -Wall -Wextra \
            -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all \
            -Iinclude -Ithird_party/yyjson src/foundations/*.c src/matchers/*.c third_party/yyjson/yyjson.c tests/fuzz/fuzz_json_condition.c \
            -o fuzz_json_condition -lm -lpthread
          ./fuzz_json_condition -max_total_time=15 -max_len=512

  packaging:
    name: Packaging & ABI (CMake Config + pkg-config + Shared SOVERSION)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pkg-config
        run: sudo apt-get update && sudo apt-get install -y pkg-config
      - name: Build & install static and shared libraries
        run: |
          cmake -B build-static -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/tmp/mongory-static -S .
          cmake --build build-static -j
          cmake --install build-static

          cmake -B build-shared -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=/tmp/mongory-shared -S .
          cmake --build build-shared -j
          cmake --install build-shared

          # Verify shared library SOVERSION symlinks exist
          ls -la /tmp/mongory-shared/lib/libmongory-core.so*
          test -L /tmp/mongory-shared/lib/libmongory-core.so
          test -L /tmp/mongory-shared/lib/libmongory-core.so.0
      - name: Verify CMake find_package(mongory-core) and pkg-config consumers
        run: |
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/main.c <<'EOF'
          #include <assert.h>
          #include <mongory-core.h>
          int main(void) {
            mongory_init();
            mongory_memory_pool *pool = mongory_memory_pool_new();
            mongory_value *cond = MG_TABLE_WRAP(pool, 1, "age", MG_TABLE_WRAP(pool, 1, "$gte", mongory_value_wrap_i(pool, 18)));
            mongory_value *rec = MG_TABLE_WRAP(pool, 1, "age", mongory_value_wrap_i(pool, 21));
            mongory_matcher *m = mongory_matcher_new(pool, cond, NULL);
            assert(m != NULL && mongory_matcher_match(m, rec));
            pool->free(pool);
            mongory_cleanup();
            return 0;
          }
          EOF
          cat > /tmp/consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.12)
          project(consumer C)
          find_package(mongory-core 0.2 REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE mongory-core::mongory-core)
          EOF

          # 1. CMake find_package against static install
          cmake -B /tmp/consumer/build-static -DCMAKE_PREFIX_PATH=/tmp/mongory-static -S /tmp/consumer
          cmake --build /tmp/consumer/build-static
          /tmp/consumer/build-static/consumer

          # 2. CMake find_package against shared install
          cmake -B /tmp/consumer/build-shared -DCMAKE_PREFIX_PATH=/tmp/mongory-shared -S /tmp/consumer
          cmake --build /tmp/consumer/build-shared
          /tmp/consumer/build-shared/consumer

          # 3. pkg-config against static install
          PKG_CONFIG_PATH=/tmp/mongory-static/lib/pkgconfig \
            cc /tmp/consumer/main.c -o /tmp/consumer/pkg_static \
            $(PKG_CONFIG_PATH=/tmp/mongory-static/lib/pkgconfig pkg-config --cflags --libs --static mongory-core)
          /tmp/consumer/pkg_static

          # 4. pkg-config against shared install
          PKG_CONFIG_PATH=/tmp/mongory-shared/lib/pkgconfig \
            cc /tmp/consumer/main.c -Wl,-rpath,/tmp/mongory-shared/lib -o /tmp/consumer/pkg_shared \
            $(PKG_CONFIG_PATH=/tmp/mongory-shared/lib/pkgconfig pkg-config --cflags --libs mongory-core)
          /tmp/consumer/pkg_shared

  benchmark-gate:
    name: Benchmark Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup test dependencies
        run: |
          chmod +x scripts/setup_unity.sh scripts/setup_yyjson.sh
          ./scripts/setup_unity.sh
          ./scripts/setup_yyjson.sh
      - name: Build Release benchmark suite
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=ON -S .
          cmake --build build --target benchmark_bench_suite -j
      - name: Run benchmark regression gate
        run: bash scripts/bench_gate.sh ./build/bin/benchmark_bench_suite
