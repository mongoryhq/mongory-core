name: mongory-spec conformance

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      spec_ref:
        description: "mongory-spec ref (branch, tag, or SHA) to test against"
        required: false
        default: "main"

jobs:
  conformance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Checkout mongory-spec
      uses: actions/checkout@v4
      with:
        repository: mongoryhq/mongory-spec
        ref: ${{ github.event.inputs.spec_ref || 'main' }}
        path: mongory-spec

    - name: Show mongory-spec revision
      shell: bash
      working-directory: mongory-spec
      run: |
        echo "mongory-spec $(cat VERSION) @ $(git rev-parse --short HEAD)"

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y libcjson-dev libpcre2-dev

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-cjson
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-pkgconf

    - name: Setup Unity test framework (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x scripts/setup_unity.sh
        ./scripts/setup_unity.sh

    - name: Setup Unity test framework (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        bash scripts/setup_unity.sh

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_BENCHMARKS=OFF
        -DMONGORY_SPEC_DIR=${{ github.workspace }}/mongory-spec
        -S .

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_BENCHMARKS=OFF
        -DMONGORY_SPEC_DIR="${{ github.workspace }}/mongory-spec"
        -S .

    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: cmake --build build --config Release

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: cmake --build build --config Release

    - name: Run conformance tests (Linux)
      if: runner.os == 'Linux'
      working-directory: build
      run: ctest --build-config Release --label-regex conformance --output-on-failure

    - name: Run conformance tests (Windows)
      if: runner.os == 'Windows'
      working-directory: build
      shell: msys2 {0}
      run: ctest --build-config Release --label-regex conformance --output-on-failure
