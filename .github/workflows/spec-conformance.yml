name: mongory-spec conformance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      spec_ref:
        description: "mongory-spec ref (branch, tag, or SHA) to test against"
        required: false
        default: "v0.2.1"

jobs:
  conformance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Checkout mongory-spec
      uses: actions/checkout@v4
      with:
        repository: mongoryhq/mongory-spec
        ref: ${{ github.event.inputs.spec_ref || 'v0.2.1' }}
        path: mongory-spec

    - name: Show mongory-spec revision
      shell: bash
      working-directory: mongory-spec
      run: |
        echo "mongory-spec $(cat VERSION) @ $(git rev-parse --short HEAD)"

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y libpcre2-dev

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-pkgconf

    - name: Setup test dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        chmod +x scripts/setup_unity.sh scripts/setup_yyjson.sh
        ./scripts/setup_unity.sh
        ./scripts/setup_yyjson.sh

    - name: Setup test dependencies (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        bash scripts/setup_unity.sh
        bash scripts/setup_yyjson.sh

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_BENCHMARKS=OFF
        -DMONGORY_SPEC_DIR=${{ github.workspace }}/mongory-spec
        -S .

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_BENCHMARKS=OFF
        -DMONGORY_SPEC_DIR="${{ github.workspace }}/mongory-spec"
        -S .

    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: cmake --build build --config Release

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: cmake --build build --config Release

    - name: Run conformance tests (Linux)
      if: runner.os == 'Linux'
      working-directory: build
      run: ctest --build-config Release --label-regex conformance --output-on-failure

    - name: Run conformance tests (Windows)
      if: runner.os == 'Windows'
      working-directory: build
      shell: msys2 {0}
      run: ctest --build-config Release --label-regex conformance --output-on-failure

  conformance-sanitizers:
    name: Conformance (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Debug + ASan/UBSan
            sanitizers: address,undefined
            asan_options: "detect_leaks=1:halt_on_error=1"
            ubsan_options: "print_stacktrace=1:halt_on_error=1"
            tsan_options: ""
          - label: Debug + TSan
            sanitizers: thread
            asan_options: ""
            ubsan_options: ""
            tsan_options: "halt_on_error=1:second_deadlock_stack=1"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout mongory-spec
        uses: actions/checkout@v4
        with:
          repository: mongoryhq/mongory-spec
          ref: ${{ github.event.inputs.spec_ref || 'v0.2.1' }}
          path: mongory-spec

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libpcre2-dev

      - name: Setup test dependencies
        run: |
          chmod +x scripts/setup_unity.sh scripts/setup_yyjson.sh
          ./scripts/setup_unity.sh
          ./scripts/setup_yyjson.sh

      - name: Configure CMake (Debug + ${{ matrix.sanitizers }})
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_BENCHMARKS=OFF
          -DMONGORY_SANITIZERS=${{ matrix.sanitizers }}
          -DMONGORY_SPEC_DIR=${{ github.workspace }}/mongory-spec
          -S .

      - name: Build
        run: cmake --build build --config Debug -j

      - name: Run conformance tests
        working-directory: build
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          TSAN_OPTIONS: ${{ matrix.tsan_options }}
        run: ctest --build-config Debug --label-regex conformance --output-on-failure
